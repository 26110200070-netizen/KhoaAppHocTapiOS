name: Build iOS IPA (KhoaStudy)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned IPA on macOS
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS Application (Unsigned)
        run: |
          xcodebuild clean build \
            -project KhoaStudy.xcodeproj \
            -scheme KhoaStudy \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=./build

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r ./build/Release-iphoneos/*.app Payload/
          zip -r Shimy_Unsigned.ipa Payload
          cp Shimy_Unsigned.ipa KhoaStudy_Unsigned.ipa
          ls -lh *.ipa

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Shimy-iOS-IPA
          path: Shimy_Unsigned.ipa
          retention-days: 30

      - name: Create GitHub Release with IPA Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Shimy v1.2.0 (Build ${{ github.run_number }})
          body: |
            ## 📱 Shimy - Ứng Dụng Học Tập & Luyện Đề AI Thông Minh iOS
            File `.ipa` (chưa ký) đã được build thành công từ máy chủ macOS!

            ### 🚀 Hướng dẫn cài đặt lên iPhone / iPad:
            1. Tải file `Shimy_Unsigned.ipa` (hoặc `KhoaStudy_Unsigned.ipa`) bên dưới về máy tính hoặc mở trực tiếp trên iPhone.
            2. Sử dụng chứng chỉ cá nhân của bạn để ký qua các công cụ phổ biến:
               - **ESign** hoặc **Scarlet** (Ký và cài trực tiếp ngay trên iPhone không cần máy tính).
               - **Sideloadly** (Ký từ máy tính Windows và cài vào iPhone qua cáp Lightning/Type-C).
               - **TrollStore** (Cài vĩnh viễn không cần ký nếu máy hỗ trợ TrollStore).
            3. Mở ứng dụng Shimy và bắt đầu học tập cùng Google Gemini AI!
          files: |
            Shimy_Unsigned.ipa
            KhoaStudy_Unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
